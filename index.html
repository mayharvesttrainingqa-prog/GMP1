
<script>
/* ==========================================
   GMP AND LOOSE ITEM CONTROL MONITORING
   Main JavaScript
========================================== */

const STORAGE_KEY = "GMP_LOOSE_ITEM_RECORDS_V1";
const WEEK_KEY = "GMP_WEEKLY_REVIEWS_V1";

const CHECK_ITEMS = [
  "Wearing complete and proper uniform",
  "Wearing hairnet properly",
  "Wearing beard cover when applicable",
  "Wearing clean safety shoes",
  "Fingernails are short and clean",
  "No jewelry or accessories",
  "No exposed wounds or uncovered injuries",
  "No signs of illness",
  "No eating, drinking or chewing gum",
  "Personal belongings are properly secured",
  "Loose items are declared",
  "No unauthorized tools or materials",
  "Proper handwashing and sanitizing completed",
  "Proper PPE is worn for assigned area",
  "Uniform is clean and in good condition"
];

let records = loadData(STORAGE_KEY, []);
let weeklyReviews = loadData(WEEK_KEY, {});
let selectedRecordId = null;
let signatureDirty = false;

const $ = id => document.getElementById(id);

function loadData(key, fallback) {
  try {
    return JSON.parse(localStorage.getItem(key)) ?? fallback;
  } catch {
    return fallback;
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  localStorage.setItem(WEEK_KEY, JSON.stringify(weeklyReviews));
}

function uid() {
  return "GMP-" + Date.now() + "-" +
    Math.random().toString(36).slice(2, 7);
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

function localDateTime(date = new Date()) {
  const pad = n => String(n).padStart(2, "0");
  return date.getFullYear() + "-" +
    pad(date.getMonth() + 1) + "-" +
    pad(date.getDate()) + "T" +
    pad(date.getHours()) + ":" +
    pad(date.getMinutes());
}

function formatDate(value) {
  if (!value) return "—";
  const d = new Date(value);
  return isNaN(d) ? value :
    d.toLocaleString("en-PH", {
      year: "numeric",
      month: "short",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    });
}

function showMessage(message, type = "success") {
  const box = $("regMsg");
  box.textContent = message;
  box.style.background = type === "error" ? "#fde8e7" : "#e1f4e8";
  box.style.borderLeftColor = type === "error" ? "#b42318" : "#176b45";
  box.classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function hideMessage() {
  $("regMsg").classList.add("hidden");
}

/* ==========================================
   TABS
========================================== */

document.querySelectorAll("[data-tab]").forEach(button => {
  button.addEventListener("click", () => openTab(button.dataset.tab));
});

function openTab(tab) {
  document.querySelectorAll(".screen").forEach(section => {
    section.classList.toggle("hidden", section.id !== tab);
  });

  $("report").classList.add("hidden");

  document.querySelectorAll("[data-tab]").forEach(button => {
    button.classList.toggle("active", button.dataset.tab === tab);
  });

  if (tab === "verify") renderPending();
  if (tab === "records") renderRecords();
  if (tab === "weekly") renderWeekly();
  if (tab === "violators") renderViolators();

  hideMessage();
}

/* ==========================================
   REGISTRATION FORM
========================================== */

function initChecklist() {
  $("gmpChecks").innerHTML = CHECK_ITEMS.map((item, i) => `
    <label class="check">
      <input type="checkbox" class="gmp-check"
        value="${esc(item)}" id="gmp_${i}">
      <span>${esc(item)}</span>
    </label>
  `).join("");
}

function resetForm() {
  ["person", "agency", "area", "purpose", "dress",
   "gmpRemarks", "looseItems"].forEach(id => $(id).value = "");

  $("declaration").checked = false;

  document.querySelectorAll(".gmp-check").forEach(c => {
    c.checked = false;
  });

  $("timeIn").value = localDateTime();
  hideMessage();
}

$("checkAll").addEventListener("click", () => {
  document.querySelectorAll(".gmp-check").forEach(c => {
    c.checked = true;
  });
});

$("resetForm").addEventListener("click", resetForm);

$("submitRecord").addEventListener("click", () => {
  const name = $("person").value.trim();
  const timeIn = $("timeIn").value;
  const agency = $("agency").value;
  const area = $("area").value;
  const dress = $("dress").value;

  if (!name || !timeIn || !agency || !area || !dress) {
    showMessage("Please complete all required fields.", "error");
    return;
  }

  if (new Date(timeIn) > new Date()) {
    showMessage("Time In cannot be in the future.", "error");
    return;
  }

  if (!$("declaration").checked) {
    showMessage("Please confirm the loose item declaration.", "error");
    return;
  }

  const checks = [...document.querySelectorAll(".gmp-check")];

  const record = {
    id: uid(),
    timestamp: new Date().toISOString(),
    person: name,
    timeIn,
    timeOut: "",
    agency,
    area,
    purpose: $("purpose").value.trim(),
    dress,
    checklist: checks.map(c => ({
      item: c.value,
      passed: c.checked
    })),
    remarks: $("gmpRemarks").value.trim(),
    looseItems: $("looseItems").value.trim(),
    declaration: true,
    decision: "Pending Verification",
    reviewer: "",
    decisionTime: "",
    decisionRemarks: "",
    weeklyReviewedBy: "",
    weekStart: ""
  };

  records.unshift(record);
  saveData();

  showMessage("Registration submitted successfully. Waiting for reviewer verification.");

  resetForm();
});

/* ==========================================
   REVIEWER VERIFICATION
========================================== */

function getViolations(record) {
  return record.checklist
    .filter(c => !c.passed)
    .map(c => c.item);
}

function renderPending() {
  const pending = records.filter(r =>
    r.decision === "Pending Verification"
  );

  if (!pending.length) {
    $("pendingList").innerHTML =
      '<p class="muted">No personnel waiting for verification.</p>';
    return;
  }

  $("pendingList").innerHTML = pending.map(r => {
    const violations = getViolations(r);

    return `
      <div class="panel">
        <h3>${esc(r.person)}</h3>
        <p><b>Agency:</b> ${esc(r.agency)}</p>
        <p><b>Area:</b> ${esc(r.area)}</p>
        <p><b>Time In:</b> ${formatDate(r.timeIn)}</p>
        <p><b>Dress Code:</b> ${esc(r.dress)}</p>
        <p><b>Loose Items:</b> ${esc(r.looseItems || "None declared")}</p>
        <p><b>GMP Checklist:</b> ${r.checklist.filter(c => c.passed).length}
        / ${r.checklist.length} passed</p>

        ${violations.length ? `
          <div class="note">
            <b>Items requiring attention:</b>
            <ul>${violations.map(v => `<li>${esc(v)}</li>`).join("")}</ul>
          </div>` : `
          <p class="status verified">All checklist items passed</p>
        `}

        <p><b>Remarks:</b> ${esc(r.remarks || "None")}</p>

        <div class="actions">
          <button onclick="makeDecision('${r.id}','Allow Enter')">
            Allow Enter
          </button>
          <button class="danger"
            onclick="makeDecision('${r.id}','Not Permitted')">
            Not Permitted
          </button>
        </div>
      </div>
    `;
  }).join("");
}

function makeDecision(id, decision) {
  const r = records.find(x => x.id === id);
  if (!r || r.decision !== "Pending Verification") return;

  const reviewer = prompt("Enter reviewer / verifier full name:");
  if (!reviewer || !reviewer.trim()) return;

  let remarks = "";

  if (decision === "Not Permitted") {
    remarks = prompt("Reason for not permitting entry:") || "";

    if (!remarks.trim()) {
      alert("Please provide the reason for not permitting entry.");
      return;
    }
  }

  if (!confirm("Confirm decision: " + decision + "?")) return;

  r.decision = decision;
  r.reviewer = reviewer.trim();
  r.decisionTime = new Date().toISOString();
  r.decisionRemarks = remarks.trim();

  saveData();
  renderPending();
  alert("Entry decision successfully recorded.");
}

/* ==========================================
   TIME OUT
========================================== */

function recordTimeOut(id) {
  const r = records.find(x => x.id === id);

  if (!r || r.decision !== "Allow Enter") return;

  if (r.timeOut) {
    alert("Time Out has already been recorded.");
    return;
  }

  if (!confirm("Record current time as Time Out for " + r.person + "?")) return;

  r.timeOut = localDateTime();

  saveData();
  renderRecords();
}

/* ==========================================
   WEEK CALCULATION
========================================== */

function getWeekStart(dateString) {
  const d = new Date(dateString + "T12:00:00");
  const day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));

  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function getWeekEnd(start) {
  const d = new Date(start + "T12:00:00");
  d.setDate(d.getDate() + 6);

  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function getWeekRecords(start) {
  const end = getWeekEnd(start);

  return records.filter(r => {
    const date = r.timeIn.slice(0, 10);
    return date >= start && date <= end;
  });
}

function updateWeekLabel() {
  const date = $("weekDate").value;
  if (!date) return;

  const start = getWeekStart(date);
  const end = getWeekEnd(start);

  $("weekLabel").value = start + " to " + end;
  renderWeeklySummary(start);
}

$("weekDate").addEventListener("change", updateWeekLabel);

/* ==========================================
   WEEKLY REVIEW
========================================== */

function renderWeekly() {
  if (!$("weekDate").value) {
    $("weekDate").value = localDateTime().slice(0, 10);
  }

  updateWeekLabel();
}

function renderWeeklySummary(start) {
  const list = getWeekRecords(start);
  const pending = list.filter(r =>
    r.decision === "Pending Verification"
  );

  const allowed = list.filter(r =>
    r.decision === "Allow Enter"
  );

  const denied = list.filter(r =>
    r.decision === "Not Permitted"
  );

  const review = weeklyReviews[start];

  $("weekSummary").innerHTML = `
    <div class="grid">
      <div class="panel">
        <h3>Total Registrations</h3>
        <h2>${list.length}</h2>
      </div>
      <div class="panel">
        <h3>Allowed Entry</h3>
        <h2>${allowed.length}</h2>
      </div>
      <div class="panel">
        <h3>Not Permitted</h3>
        <h2>${denied.length}</h2>
      </div>
    </div>

    <p><b>Pending Verification:</b> ${pending.length}</p>
    <p><b>Weekly Review Status:</b>
      ${review ? '<span class="status verified">Reviewed</span>' :
        '<span class="status pending">Pending Review</span>'}
    </p>

    ${review ? `
      <p><b>Reviewed By:</b> ${esc(review.name)}</p>
      <p><b>Review Date:</b> ${formatDate(review.date)}</p>
      <img src="${review.signature}" alt="Weekly signature"
        style="max-width:300px;width:100%;border:1px solid #ddd">
    ` : ""}
  `;
}

/* ==========================================
   SIGNATURE PAD
========================================== */

const canvas = $("signature");
const ctx = canvas.getContext("2d");

function resizeSignature() {
  const old = signatureDirty ? canvas.toDataURL() : null;

  const width = canvas.clientWidth || 640;
  canvas.width = width;
  canvas.height = 240;

  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#173c29";

  if (old) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = old;
  }
}

function getPointerPosition(e) {
  const rect = canvas.getBoundingClientRect();

  return {
    x: (e.clientX - rect.left) * canvas.width / rect.width,
    y: (e.clientY - rect.top) * canvas.height / rect.height
  };
}

let drawing = false;

canvas.addEventListener("pointerdown", e => {
  drawing = true;
  signatureDirty = true;
  canvas.setPointerCapture(e.pointerId);

  const p = getPointerPosition(e);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
});

canvas.addEventListener("pointermove", e => {
  if (!drawing) return;

  const p = getPointerPosition(e);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
});

function stopDrawing() {
  drawing = false;
}

canvas.addEventListener("pointerup", stopDrawing);
canvas.addEventListener("pointercancel", stopDrawing);

$("clearSignature").addEventListener("click", () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  signatureDirty = false;
});

$("saveWeekly").addEventListener("click", () => {
  const date = $("weekDate").value;
  const name = $("weeklyName").value.trim();

  if (!date || !name) {
    alert("Please select a week and enter the reviewer name.");
    return;
  }

  const start = getWeekStart(date);
  const list = getWeekRecords(start);

  if (!list.length) {
    alert("No registrations found for this week.");
    return;
  }

  if (list.some(r => r.decision === "Pending Verification")) {
    alert("All registrations must have an entry decision before weekly review.");
    return;
  }

  if (!signatureDirty) {
    alert("Please provide the reviewer's signature.");
    return;
  }

  if (weeklyReviews[start]) {
    if (!confirm("A weekly review already exists. Replace it?")) return;
  }

  const signature = canvas.toDataURL("image/png");

  weeklyReviews[start] = {
    name,
    date: new Date().toISOString(),
    signature
  };

  list.forEach(r => {
    r.weeklyReviewedBy = name;
    r.weekStart = start;
  });

  saveData();
  renderWeeklySummary(start);

  alert("Weekly review successfully saved.");
});

/* ==========================================
   MONITORING RECORDS
========================================== */

function getRecordStatus(r) {
  if (r.decision === "Pending Verification") {
    return "Pending Verification";
  }

  const start = getWeekStart(r.timeIn.slice(0, 10));

  if (!weeklyReviews[start]) {
    return "Pending Weekly Review";
  }

  return r.decision;
}

function renderRecords() {
  const filter = $("filterStatus").value;
  const search = $("searchRecords").value.toLowerCase();

  const list = records.filter(r => {
    const status = getRecordStatus(r);

    const matchStatus = filter === "All" || status === filter;

    const matchSearch =
      r.person.toLowerCase().includes(search) ||
      r.agency.toLowerCase().includes(search);

    return matchStatus && matchSearch;
  });

  $("recordsRows").innerHTML = list.length ? list.map(r => {
    const status = getRecordStatus(r);
    const cls = status === "Allow Enter" ? "verified" :
      status === "Not Permitted" ? "rejected" : "pending";

    return `
      <tr>
        <td>${formatDate(r.timestamp)}</td>
        <td><b>${esc(r.person)}</b><br>
          <span class="muted">${esc(r.purpose)}</span></td>
        <td>${esc(r.agency)}<br>${esc(r.area)}</td>
        <td>${esc(r.looseItems || "None declared")}</td>
        <td>
          In: ${formatDate(r.timeIn)}<br>
          Out: ${formatDate(r.timeOut)}
          ${r.decision === "Allow Enter" && !r.timeOut ? `
            <button class="small" onclick="recordTimeOut('${r.id}')">
              Time Out
            </button>` : ""}
        </td>
        <td>
          <span class="status ${cls}">${esc(status)}</span>
          <br>${esc(r.reviewer || "Not yet reviewed")}
        </td>
        <td>${esc(r.weeklyReviewedBy || "Pending")}</td>
        <td class="no-print">
          <button class="small secondary"
            onclick="viewRecord('${r.id}')">View / PDF</button>
        </td>
      </tr>
    `;
  }).join("") : `
    <tr><td colspan="8">No matching records found.</td></tr>
  `;
}

$("filterStatus").addEventListener("change", renderRecords);
$("searchRecords").addEventListener("input", renderRecords);
$("refreshRecords").addEventListener("click", renderRecords);

/* ==========================================
   INDIVIDUAL REPORT
========================================== */

function viewRecord(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;

  const violations = getViolations(r);

  $("reportContent").innerHTML = `
    <h2>GMP AND LOOSE ITEM CONTROL MONITORING</h2>
    <h3>Individual Personnel Inspection Report</h3>

    <p><b>Record ID:</b> ${esc(r.id)}</p>
    <p><b>Registration Date:</b> ${formatDate(r.timestamp)}</p>
    <p><b>Personnel:</b> ${esc(r.person)}</p>
    <p><b>Agency:</b> ${esc(r.agency)}</p>
    <p><b>Area:</b> ${esc(r.area)}</p>
    <p><b>Position / Purpose:</b> ${esc(r.purpose)}</p>
    <p><b>Dress Code:</b> ${esc(r.dress)}</p>
    <p><b>Time In:</b> ${formatDate(r.timeIn)}</p>
    <p><b>Time Out:</b> ${formatDate(r.timeOut)}</p>

    <h3>GMP Checklist</h3>
    <table>
      <thead><tr><th>Checklist Item</th><th>Result</th></tr></thead>
      <tbody>
        ${r.checklist.map(c => `
          <tr>
            <td>${esc(c.item)}</td>
            <td>${c.passed ? "PASS" : "NOT MET"}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>

    <h3>Loose Item Declaration</h3>
    <p>${esc(r.looseItems || "None declared")}</p>

    <h3>Remarks / Corrective Action</h3>
    <p>${esc(r.remarks || "None")}</p>

    <h3>Reviewer Verification</h3>
    <p><b>Decision:</b> ${esc(r.decision)}</p>
    <p><b>Verified By:</b> ${esc(r.reviewer || "Pending")}</p>
    <p><b>Verification Date:</b> ${formatDate(r.decisionTime)}</p>
    <p><b>Decision Remarks:</b> ${esc(r.decisionRemarks || "None")}</p>

    <h3>Checklist Deficiencies</h3>
    <p>${violations.length ?
      violations.map(esc).join("<br>") : "No checklist deficiencies."}</p>

    <h3>Weekly Review</h3>
    <p><b>Reviewed By:</b> ${esc(r.weeklyReviewedBy || "Pending")}</p>
  `;

  document.querySelectorAll(".screen").forEach(s => s.classList.add("hidden"));
  $("report").classList.remove("hidden");
}

$("backRecords").addEventListener("click", () => openTab("records"));

/* ==========================================
   CSV DOWNLOAD
========================================== */

function downloadCSV(filename, rows) {
  const csv = rows.map(row => row.map(value =>
    '"' + String(value ?? "").replace(/"/g, '""') + '"'
  ).join(",")).join("\r\n");

  const blob = new Blob(["\uFEFF" + csv], {
    type: "text/csv;charset=utf-8;"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = filename;
  a.click();

  URL.revokeObjectURL(url);
}

$("exportCsv").addEventListener("click", () => {
  const rows = [[
    "Record ID", "Registration Date", "Personnel",
    "Agency", "Area", "Purpose", "Dress Code",
    "Time In", "Time Out", "Loose Items",
    "GMP Passed", "GMP Deficiencies", "Remarks",
    "Decision", "Verified By", "Verification Date",
    "Weekly Reviewed By"
  ]];

  records.forEach(r => {
    rows.push([
      r.id, r.timestamp, r.person, r.agency,
      r.area, r.purpose, r.dress, r.timeIn,
      r.timeOut, r.looseItems,
      r.checklist.filter(c => c.passed).length,
      getViolations(r).join("; "),
      r.remarks, r.decision, r.reviewer,
      r.decisionTime, r.weeklyReviewedBy
    ]);
  });

  downloadCSV("GMP_Monitoring_Records.csv", rows);
});

/* ==========================================
   GMP VIOLATORS
========================================== */

function renderViolators() {
  const violations = records.flatMap(r =>
    getViolations(r).map(item => ({ r, item }))
  );

  const search = $("searchViolators").value.toLowerCase();
  const filter = $("filterViolation").value;

  const unique = [...new Set(violations.map(v => v.item))];

  $("filterViolation").innerHTML =
    '<option value="">All Violations</option>' +
    unique.map(v =>
      `<option value="${esc(v)}">${esc(v)}</option>`
    ).join("");

  $("filterViolation").value = filter;

  const filtered = violations.filter(v => {
    const matchViolation = !filter || v.item === filter;
    const matchSearch =
      v.r.person.toLowerCase().includes(search) ||
      v.r.agency.toLowerCase().includes(search);

    return matchViolation && matchSearch;
  });

  $("violGenerated").textContent =
    "Report generated: " + formatDate(new Date().toISOString());

  $("violSummary").innerHTML = `
    <div class="panel">
      <b>Total checklist deficiencies:</b> ${violations.length}
      <br><b>Personnel with deficiencies:</b>
      ${new Set(violations.map(v => v.r.id)).size}
    </div>
  `;

  $("violRows").innerHTML = filtered.length ?
    filtered.map((v, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${formatDate(v.r.timestamp)}</td>
        <td>${esc(v.r.person)}</td>
        <td>${esc(v.r.agency)} / ${esc(v.r.area)}</td>
        <td>${esc(v.item)}</td>
        <td>${esc(v.r.remarks || v.r.decisionRemarks || "None")}</td>
        <td>${esc(v.r.reviewer || "Pending")}</td>
      </tr>
    `).join("") :
    '<tr><td colspan="7">No matching checklist deficiencies.</td></tr>';
}

$("filterViolation").addEventListener("change", renderViolators);
$("searchViolators").addEventListener("input", renderViolators);

$("exportViol").addEventListener("click", () => {
  const rows = [[
    "Date", "Personnel", "Agency", "Area",
    "Violation", "Remarks", "Verified By"
  ]];

  records.forEach(r => {
    getViolations(r).forEach(item => {
      rows.push([
        r.timestamp, r.person, r.agency,
        r.area, item, r.remarks, r.reviewer
      ]);
    });
  });

  downloadCSV("GMP_Violators.csv", rows);
});

/* ==========================================
   FULL REPORT
========================================== */

$("exportAllPdf").addEventListener("click", () => {
  if (!records.length) {
    alert("No records available for reporting.");
    return;
  }

  const groups = {};

  records.forEach(r => {
    const week = getWeekStart(r.timeIn.slice(0, 10));
    if (!groups[week]) groups[week] = [];
    groups[week].push(r);
  });

  let html = `
    <h1>GMP AND LOOSE ITEM CONTROL MONITORING</h1>
    <h2>Consolidated Monitoring Report</h2>
    <p>Generated: ${formatDate(new Date().toISOString())}</p>
    <hr>
  `;

  Object.keys(groups).sort().forEach(week => {
    const review = weeklyReviews[week];

    html += `
      <h2>Week Covered: ${week} to ${getWeekEnd(week)}</h2>
      <p><b>Reviewed By:</b> ${esc(review?.name || "Pending Review")}</p>
      ${review ? `
        <img src="${review.signature}" style="max-width:250px;width:100%">
      ` : ""}
      <table>
        <thead>
          <tr>
            <th>Personnel</th><th>Agency / Area</th>
            <th>Time In / Out</th><th>Decision</th>
            <th>Violations</th>
          </tr>
        </thead>
        <tbody>
    `;

    groups[week].forEach(r => {
      html += `
        <tr>
          <td>${esc(r.person)}</td>
          <td>${esc(r.agency)} / ${esc(r.area)}</td>
          <td>${formatDate(r.timeIn)}<br>${formatDate(r.timeOut)}</td>
          <td>${esc(r.decision)}</td>
          <td>${esc(getViolations(r).join("; ") || "None")}</td>
        </tr>
      `;
    });

    html += "</tbody></table><hr>";
  });

  $("reportContent").innerHTML = html;

  document.querySelectorAll(".screen").forEach(s =>
    s.classList.add("hidden")
  );

  $("report").classList.remove("hidden");

  window.print();
});

/* ==========================================
   INITIALIZATION
========================================== */

function initializeApp() {
  initChecklist();

  $("timeIn").value = localDateTime();

  $("weekDate").value = localDateTime().slice(0, 10);

  resizeSignature();
  renderRecords();
  renderPending();
  renderWeekly();
  renderViolators();
}

window.addEventListener("resize", () => {
  if ($("weekly").classList.contains("hidden")) return;
  resizeSignature();
});

initializeApp();

</script>
